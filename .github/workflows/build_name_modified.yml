name: Build Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-modified:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: '1.17.8' 
      
      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
          
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      - name: Modify App Name and Package
        run: |
      
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">MedTimerE</string>|' app/src/main/res/values/strings.xml
          
          for file in app/src/main/res/values-*/strings.xml; do
            [ -f "$file" ] && sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">MedTimerE</string>|' "$file"
          done
          
          OLD_PACKAGE="com.futsch1.medtimer" 
          NEW_PACKAGE="com.futsch1.medtimer.e" 
          
          if [ -f "app/build.gradle" ]; then
            sed -i "s|applicationId \"$OLD_PACKAGE\"|applicationId \"$NEW_PACKAGE\"|g" app/build.gradle
            sed -i "s|applicationId \"[^\"]*\"|applicationId \"$NEW_PACKAGE\"|g" app/build.gradle
          fi
          
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i "s|package=\"$OLD_PACKAGE\"|package=\"$NEW_PACKAGE\"|g" app/src/main/AndroidManifest.xml
          fi
          
          OLD_PATH=$(echo "$OLD_PACKAGE" | sed 's|\.|/|g')
          NEW_PATH=$(echo "$NEW_PACKAGE" | sed 's|\.|/|g')
          
          if [ -d "app/src/main/java/$OLD_PATH" ]; then
            mkdir -p "app/src/main/java/$NEW_PATH"
            

            cp -r "app/src/main/java/$OLD_PATH/"* "app/src/main/java/$NEW_PATH/" 2>/dev/null || true
            
            find "app/src/main/java/$NEW_PATH" -type f \( -name "*.java" -o -name "*.kt" \) | while read file; do
              sed -i "s|package $OLD_PACKAGE|package $NEW_PACKAGE|g" "$file"
              sed -i "s|import $OLD_PACKAGE|import $NEW_PACKAGE|g" "$file"
            done
            
            find app/src -type f \( -name "*.xml" -o -name "*.java" -o -name "*.kt" -o -name "*.gradle" \) -exec grep -l "$OLD_PACKAGE" {} \; | while read file; do
              sed -i "s|$OLD_PACKAGE|$NEW_PACKAGE|g" "$file"
            done
          fi
          
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug

      - name: Upload Modified APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: modified-app
          path: app/build/outputs/apk/debug/*-debug.apk
          retention-days: 90
